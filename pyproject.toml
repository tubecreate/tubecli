[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubecli"
version = "2026.08.09.50"
description = "Open Source AI Agent CLI System — Install, manage, and orchestrate AI agents, skills, and workflows from the command line."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TubeCreate Team"}
]

dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    # uvicorn speaks WebSocket only when a protocol library is present. Without it
    # every @app.websocket route answers 404 while logging "No supported WebSocket
    # library detected" — which is how the browser preview lost its live stream on
    # a clean install. It worked on developer machines only because something else
    # had pulled websockets in.
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
    "uuid7",
    "aiohttp",
    "requests",
    "psutil",
    "rich>=13.0",
    "pyotp>=2.9",
    "gmssl",
    "httpx>=0.24",
    # brain._call_openai is the only transport for openai/chatgpt/deepseek/grok/
    # openrouter/9router and any OpenAI-compatible provider in the registry, so a
    # fresh install without this answered every one of them with
    # "[OpenAI Error] No module named 'openai'" printed as the assistant's reply.
    "openai>=1.0",
    "beautifulsoup4>=4.12.0",
    "lxml",
    "pyyaml",
    "stripe>=5.0",
    # File Manager · Google Drive (drive.py) + Sheets Manager. Thiếu trên bản cài sạch
    # → mọi thao tác Drive/Sheets chết runtime với "No module named 'googleapiclient'".
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.1",
    # python-docx / openpyxl: read_file trích text docx/xlsx cho Media node + AI.
    "python-docx",
    "openpyxl",
]

[project.scripts]
tubecli = "tubecli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "data*",
    "data.*",
    "*.data",
    "node_modules*",
    "dist*",
    "__pycache__*",
    "*.egg-info*",
]

[tool.setuptools.package-data]
"*" = []
