[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubecli"
version = "2026.05.29.1"
description = "Open Source AI Agent CLI System — Install, manage, and orchestrate AI agents, skills, and workflows from the command line."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TubeCreate Team"}
]

dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
    "uuid7",
    "aiohttp",
    "requests",
    "psutil",
    "rich>=13.0",
    "pyotp>=2.9",
    "gmssl",
    "httpx>=0.24",
    "beautifulsoup4>=4.12.0",
    "lxml",
    "pyyaml",
    "stripe>=5.0",
]

[project.scripts]
tubecli = "tubecli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
