<title>TubeCLI — Douyin Downloader</title>
<script>
/*
 * Pre-paint theme. Must run BEFORE any stylesheet applies so there is no dark
 * flash when the dashboard embeds this page in light mode.
 * Contract (same as file_manager.html): the dashboard appends ?theme=light|dark
 * (the cloud canvas sends ?theme=glass) to the iframe URL; this page answers by
 * setting data-theme on <html>, which activates the light token block below.
 * With no theme param: standalone follows prefers-color-scheme, but an EMBEDDED
 * page (window.self !== top) pins itself dark so a dark host stays coherent.
 */
(function () {
    try {
        var t = new URLSearchParams(window.location.search).get('theme');
        if (t === 'glass' || t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else if (window.self !== window.top) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    } catch (e) { /* no URLSearchParams / sandbox quirk: dark default stands */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0b14; --bg2: #0e0f1a; --card: #12131f; --card2: #181926;
    --border: #1e2035; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #6366f1; --accent2: #818cf8; --accent-glow: rgba(99,102,241,0.18);
    --red: #f43f5e; --green: #22c55e; --yellow: #f59e0b; --cyan: #22d3ee;
    --font: 'Inter', system-ui, sans-serif;
    /* Page-specific tokens (the dashboard never injects these — each has a
       light value in the light blocks below). */
    --accent-deep: #4f46e5;
    --accent-tint: rgba(99,102,241,0.04);
    --accent-tint-2: rgba(99,102,241,0.05);
    --on-accent: #fff;
    --track: var(--bg);
    --toast-ok-bg: rgba(34,197,94,0.15); --toast-ok-fg: #4ade80; --toast-ok-border: rgba(34,197,94,0.3);
    --toast-err-bg: rgba(244,63,94,0.15); --toast-err-fg: #fb7185; --toast-err-border: rgba(244,63,94,0.3);
    --douyin: #fe2c55; --douyin-bg: rgba(254,44,85,0.15);
    --badge-neutral-bg: rgba(255,255,255,0.08);
    /* Live player lightbox: a video stage, deliberately dark in both themes. */
    --player-backdrop: rgba(0,0,0,0.9); --player-fg: #fff; --player-stage: #000;
}

/* ── Light theme ─────────────────────────────────────────────────────────────
   Values mirror the dashboard glass palette (webui/static/style.css): ground
   #f7f8fa, white panels, slate ink #1e293b, lines rgba(15,23,42,.1). Accents
   stay; status inks darken so they pass contrast on white. Activated by the
   pre-paint script in <head> (data-theme="light") or, standalone, by
   prefers-color-scheme — guarded so an explicit data-theme always wins.
   KEEP THE TWO BLOCKS IDENTICAL: CSS cannot share a declaration list between
   a media query and an attribute selector. */
:root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa; --bg2: #ffffff; --card: #ffffff; --card2: #f3f5f9;
    --border: rgba(15,23,42,0.1); --text: #1e293b; --text2: #475569; --text3: #64748b;
    --accent2: #4f46e5;
    --red: #dc2626; --green: #15803d; --yellow: #a16207; --cyan: #0891b2;
    --accent-tint: rgba(99,102,241,0.06);
    --accent-tint-2: rgba(99,102,241,0.08);
    --track: #e8ebf1;
    --toast-ok-bg: rgba(21,128,61,0.1); --toast-ok-fg: #15803d; --toast-ok-border: rgba(21,128,61,0.3);
    --toast-err-bg: rgba(220,38,38,0.08); --toast-err-fg: #dc2626; --toast-err-border: rgba(220,38,38,0.3);
    --douyin: #be123c; --douyin-bg: rgba(254,44,85,0.12);
    --badge-neutral-bg: rgba(15,23,42,0.08);
}
@media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f7f8fa; --bg2: #ffffff; --card: #ffffff; --card2: #f3f5f9;
        --border: rgba(15,23,42,0.1); --text: #1e293b; --text2: #475569; --text3: #64748b;
        --accent2: #4f46e5;
        --red: #dc2626; --green: #15803d; --yellow: #a16207; --cyan: #0891b2;
        --accent-tint: rgba(99,102,241,0.06);
        --accent-tint-2: rgba(99,102,241,0.08);
        --track: #e8ebf1;
        --toast-ok-bg: rgba(21,128,61,0.1); --toast-ok-fg: #15803d; --toast-ok-border: rgba(21,128,61,0.3);
        --toast-err-bg: rgba(220,38,38,0.08); --toast-err-fg: #dc2626; --toast-err-border: rgba(220,38,38,0.3);
        --douyin: #be123c; --douyin-bg: rgba(254,44,85,0.12);
        --badge-neutral-bg: rgba(15,23,42,0.08);
    }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }

/* Header */
.header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:var(--bg2); }
.header h1 { font-size:17px; font-weight:700; }
.header h1 span { background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.back-link { color:var(--text3); text-decoration:none; font-size:13px; display:flex; align-items:center; gap:4px; transition:color .2s; }
.back-link:hover { color:var(--accent); }

/* Tabs */
.tabs { display:flex; gap:4px; padding:16px 24px 0; border-bottom:1px solid var(--border); background:var(--bg2); }
.tab { padding:9px 20px; border-radius:8px 8px 0 0; background:transparent; color:var(--text3); border:1px solid transparent; border-bottom:none; cursor:pointer; font-size:13px; font-weight:600; transition:all 0.2s; position:relative; bottom:-1px; }
.tab.active { background:var(--card); color:var(--accent); border-color:var(--border); border-bottom-color:var(--card); }
.tab:hover:not(.active) { color:var(--text2); }

/* Main */
.main { max-width:920px; margin:0 auto; padding:24px; }
.section { display:none; }
.section.active { display:block; }

/* Input Area */
.input-area { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px; }
.input-area label { font-size:13px; font-weight:600; color:var(--text2); display:block; margin-bottom:8px; }
.url-input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:12px 16px; font-size:14px; font-family:var(--font); resize:vertical; min-height:60px; outline:none; transition:border .2s; }
.url-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
.url-input::placeholder { color:var(--text3); }
.btn-row { display:flex; gap:10px; margin-top:12px; }
.btn { padding:10px 22px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background-color:var(--accent); background-image:linear-gradient(135deg, var(--accent), var(--accent2)); color:var(--on-accent); }
.btn-primary:hover { filter:brightness(1.12); transform:translateY(-1px); box-shadow:0 4px 16px var(--accent-glow); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
.btn-ghost { background:var(--card2); color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }

/* Video Cards */
.video-cards { display:flex; flex-direction:column; gap:12px; }
.video-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; gap:16px; transition:border .2s; position:relative; }
.video-card:hover { border-color:var(--accent); }
.video-thumb { width:160px; height:90px; border-radius:8px; object-fit:cover; background:var(--bg); flex-shrink:0; }
.video-info { flex:1; min-width:0; }
.video-title { font-size:14px; font-weight:600; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.video-meta { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--text3); margin-bottom:10px; }
.video-meta span { display:flex; align-items:center; gap:4px; }
.video-actions { display:flex; gap:8px; flex-wrap:wrap; }
.btn-sm { padding:6px 14px; font-size:12px; border-radius:6px; }
.btn-download { background-color:var(--accent); background-image:linear-gradient(135deg, var(--accent), var(--accent-deep)); color:var(--on-accent); border:none; cursor:pointer; font-weight:600; font-family:var(--font); transition:all .2s; }
.btn-download:hover { filter:brightness(1.12); transform:translateY(-1px); }
.btn-download:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* Progress */
.progress-bar { width:100%; height:6px; background:var(--track); border-radius:3px; overflow:hidden; margin-top:8px; }
.progress-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--cyan)); border-radius:3px; transition:width .3s; }

/* History */
.history-item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:12px; margin-bottom:8px; transition:border .2s; }
.history-item:hover { border-color:var(--border); }
.history-item .hi-icon { font-size:22px; }
.history-item .hi-info { flex:1; min-width:0; }
.history-item .hi-name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-item .hi-size { font-size:11px; color:var(--text3); margin-top:2px; }
.history-item .hi-actions { display:flex; gap:6px; }
.btn-icon { width:32px; height:32px; border-radius:6px; border:1px solid var(--border); background:var(--card2); color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .2s; text-decoration:none; }
.btn-icon:hover { border-color:var(--accent); color:var(--accent); }
.btn-icon.danger:hover { border-color:var(--red); color:var(--red); }

/* Settings */
.setting-group { margin-bottom:16px; }
.setting-group label { font-size:13px; font-weight:600; color:var(--text2); display:block; margin-bottom:6px; }
.setting-input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 14px; font-size:13px; font-family:var(--font); outline:none; transition:border .2s; }
.setting-input:focus { border-color:var(--accent); }
.field-hint { font-size:11px; color:var(--text3); margin-top:4px; }

/* Empty state */
.empty-state { text-align:center; padding:56px 24px; color:var(--text3); }
.empty-state .emoji { font-size:48px; margin-bottom:14px; }
.empty-state p { font-size:14px; }

/* Toast */
.toast-container { position:fixed; top:20px; right:20px; z-index:9999; }
.toast { padding:10px 20px; border-radius:8px; font-size:13px; margin-bottom:8px; animation:slideIn .3s ease; }
.toast.success { background:var(--toast-ok-bg); color:var(--toast-ok-fg); border:1px solid var(--toast-ok-border); }
.toast.error { background:var(--toast-err-bg); color:var(--toast-err-fg); border:1px solid var(--toast-err-border); }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

/* Loading spinner */
.spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:var(--on-accent); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Platform badge */
.badge { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; text-transform:uppercase; }
.badge-douyin { background:var(--douyin-bg); color:var(--douyin); }
.badge-tiktok { background:var(--badge-neutral-bg); color:var(--text2); }

/* Batch bar */
.batch-bar { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:12px; }
.batch-select-all { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:var(--text2); user-select:none; }
.batch-select-all input { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; }
.batch-count { font-size:12px; color:var(--text3); flex:1; }

/* Card checkbox */
.card-checkbox { position:absolute; top:10px; left:10px; z-index:2; cursor:pointer; }
.card-checkbox input { accent-color:var(--accent); width:18px; height:18px; cursor:pointer; }
.video-card:has(.video-cb:checked) { border-color:var(--accent); background:var(--accent-tint); }
</style>
</head>
<body>

<div class="header">
    <a href="/dashboard#/dashboard" target="_top" class="back-link">← Dashboard</a>
    <h1>📥 <span>Douyin Downloader</span></h1>
</div>

<div class="tabs">
    <div class="tab active" id="tab-btn-download" onclick="switchTab('download',this)">📥 <span data-i18n="dl.tab_download">Download</span></div>
    <div class="tab" id="tab-btn-history" onclick="switchTab('history',this)">📂 <span data-i18n="dl.tab_history">History</span></div>
    <div class="tab" id="tab-btn-settings" onclick="switchTab('settings',this)">⚙️ <span data-i18n="dl.tab_settings">Settings</span></div>
</div>

<div class="main">
    <!-- Download Tab -->
    <div id="tab-download" class="section active">
        <div class="input-area">
            <label data-i18n="dl.paste_label">Paste TikTok / Douyin links here</label>
            <textarea id="url-input" class="url-input"
                placeholder="https://www.douyin.com/video/7439076585594339627&#10;https://www.douyin.com/user/MS4wLjABAAAA...&#10;https://www.tiktok.com/@user/video/7439076585594339627"
                rows="3"></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" id="btn-parse" onclick="parseLinks()">
                    🔍 <span data-i18n="dl.btn_analyze">Analyze</span>
                </button>
                <button class="btn btn-ghost" onclick="clearAll()">
                    🗑️ <span data-i18n="dl.btn_clear">Clear</span>
                </button>
            </div>
        </div>

        <div id="batch-bar" class="batch-bar" style="display:none;">
            <label class="batch-select-all">
                <input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)">
                <span data-i18n="dl.select_all">Select all</span>
            </label>
            <span id="batch-count" class="batch-count">0 selected</span>
            <button class="btn btn-sm btn-primary" id="btn-download-all" onclick="downloadSelected()" disabled>
                📥 <span data-i18n="dl.btn_download_selected">Download selected</span>
            </button>
        </div>

        <div id="video-cards" class="video-cards"></div>
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="section">
        <div id="history-list"></div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="section">
        <div class="input-area">
            <div class="setting-group">
                <label>🍪 Douyin Cookie</label>
                <textarea id="set-cookie-douyin" class="setting-input" rows="3"
                    placeholder='JSON array [{"name":"key","value":"val"}] or cookie string key=val; key=val'></textarea>
                <div class="field-hint" data-i18n="dl.cookie_hint">Auto-detects format: JSON export from browser extension or raw cookie string</div>
            </div>
            <div class="setting-group">
                <label>🍪 TikTok Cookie</label>
                <textarea id="set-cookie-tiktok" class="setting-input" rows="3"
                    placeholder="Paste JSON or cookie string..."></textarea>
                <div class="field-hint" data-i18n="dl.cookie_convert_hint">Auto-converts JSON → cookie string when saving</div>
            </div>
            <div class="setting-group">
                <label>🌐 Proxy</label>
                <input type="text" id="set-proxy" class="setting-input" placeholder="http://127.0.0.1:7890">
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="saveSettings()">
                    💾 <span data-i18n="dl.btn_save_settings">Save Settings</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

const _lang = (localStorage.getItem('lang') || 'en').toLowerCase().slice(0, 2);
const _dict = LOCALES[_lang] || LOCALES['en'];

function T(key, params) {
    let s = _dict[key] || LOCALES['en'][key] || key;
    if (params) Object.keys(params).forEach(k => { s = s.replace(new RegExp('{' + k + '}', 'g'), params[k]); });
    return s;
}

// Apply i18n on load
document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key) el.textContent = T(key);
});
document.getElementById('url-input').placeholder = T('dl.paste_placeholder');

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'history') loadHistory();
    if (tab === 'settings') loadSettings();
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type = 'success') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function formatSize(bytes) {
    if (!bytes || bytes < 1024) return (bytes || 0) + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}
function formatSpeed(bps) {
    if (!bps || bps < 1024) return (bps || 0) + ' B/s';
    if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
    return (bps / 1048576).toFixed(1) + ' MB/s';
}
function formatCount(n) { if (n >= 1e6) return (n/1e6).toFixed(1)+'M'; if (n >= 1e3) return (n/1e3).toFixed(1)+'K'; return n; }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escAttr(s) { return (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ─── Parse ────────────────────────────────────────────────────────────────────
async function parseLinks() {
    const input = document.getElementById('url-input').value.trim();
    if (!input) { toast(T('dl.err_no_url'), 'error'); return; }

    const btn = document.getElementById('btn-parse');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${T('dl.analyzing')}`;

    try {
        const urls = input.split('\n').map(u => u.trim()).filter(u => u);
        const cards = document.getElementById('video-cards');
        cards.innerHTML = '';

        const isUserProfile = urls.some(u => /douyin\.com\/user\//.test(u) || (u.startsWith('MS4') && u.length > 30));

        if (isUserProfile) {
            const userUrl = urls.find(u => /douyin\.com\/user\//.test(u) || (u.startsWith('MS4') && u.length > 30));
            try {
                btn.innerHTML = `<span class="spinner"></span> ${T('dl.scanning')}`;
                const res = await fetch(`${API}/parse-user`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: userUrl}),
                });
                const data = await res.json();
                if (data.success) {
                    if (data.user) cards.innerHTML += renderUserHeader(data.user, data.total);
                    if (data.videos && data.videos.length > 0) {
                        for (const v of data.videos) cards.innerHTML += renderVideoCard(v, `https://www.douyin.com/video/${v.id}`);
                        toast(T('dl.found_videos', {n: data.total}));
                    } else {
                        cards.innerHTML += renderErrorCard(userUrl, T('dl.no_videos'));
                    }
                } else {
                    cards.innerHTML += renderErrorCard(userUrl, data.detail || T('dl.err_prefix', {msg: 'unknown'}));
                }
            } catch (e) {
                cards.innerHTML += renderErrorCard(userUrl, e.message);
            }
        } else {
            for (const url of urls) {
                try {
                    const res = await fetch(`${API}/parse`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({url}),
                    });
                    const data = await res.json();
                    if (data.success && data.data) cards.innerHTML += renderVideoCard(data.data, url);
                    else cards.innerHTML += renderErrorCard(url, data.detail || T('dl.err_prefix', {msg: 'unknown'}));
                } catch (e) {
                    cards.innerHTML += renderErrorCard(url, e.message);
                }
            }
        }
    } catch (e) {
        toast(T('dl.error', {msg: e.message}), 'error');
    }

    btn.disabled = false;
    btn.innerHTML = `🔍 ${T('dl.btn_analyze')}`;
    showBatchBar();
}

function renderUserHeader(user, total) {
    return `<div class="video-card" style="border-color:var(--accent);background:var(--accent-tint-2);">
        ${user.avatar ? `<img src="${user.avatar}" class="video-thumb" style="border-radius:50%;width:80px;height:80px;object-fit:cover;" alt="">` : ''}
        <div class="video-info">
            <div class="video-title" style="font-size:1.1em;">👤 ${escHtml(user.nickname || 'Unknown')}</div>
            <div class="video-meta">
                <span>🎬 ${user.aweme_count || total} video</span>
                <span>👥 ${formatCount(user.follower_count || 0)} followers</span>
                <span>❤️ ${formatCount(user.total_favorited || 0)} ${T('dl.likes')}</span>
            </div>
            ${user.signature ? `<div style="font-size:12px;color:var(--text3);margin-top:4px;">${escHtml(user.signature)}</div>` : ''}
        </div>
    </div>`;
}

function renderVideoCard(v, originalUrl) {
    const badge = v.platform === 'douyin'
        ? '<span class="badge badge-douyin">Douyin</span>'
        : '<span class="badge badge-tiktok">TikTok</span>';

    const coverImg = v.cover_url
        ? `<img src="${v.cover_url}" class="video-thumb" alt="" onerror="this.style.display='none'">`
        : '<div class="video-thumb" style="display:flex;align-items:center;justify-content:center;font-size:32px;">🎬</div>';

    const uid = 'vc_' + Math.random().toString(36).slice(2, 8);
    let actionsHtml = '';

    if (v.type === 'live') {
        const hlsMap = v.raw_data?.stream_url?.hls_pull_url_map || {};
        const flvMap = v.raw_data?.stream_url?.flv_pull_url_map || {};
        let opts = '';
        for (const [key, url] of Object.entries(hlsMap)) {
            opts += `<option value="${escAttr(url)}" data-flv="${escAttr(flvMap[key] || '')}">${key}</option>`;
        }
        if (!opts && v.download_url) opts = `<option value="${escAttr(v.download_url)}">Default</option>`;
        const selId = 'sel_' + uid;
        actionsHtml = `
            <select id="${selId}" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:12px;">${opts}</select>
            <button class="btn btn-sm btn-primary" onclick="playLive('${selId}','${escAttr(v.title||'Live')}','${escAttr(v.cover_url||'')}')">${T('dl.open_player')}</button>
            <button class="btn btn-sm btn-ghost" onclick="copyStream('${selId}','hls')">📋 HLS</button>
            <button class="btn btn-sm btn-ghost" onclick="copyStream('${selId}','flv')">📋 FLV</button>`;
    } else {
        actionsHtml = `<button class="btn btn-sm btn-download" onclick="downloadVideo('${uid}','${escAttr(originalUrl)}')">${T('dl.download')}</button>`;
    }

    return `<div class="video-card" id="${uid}" data-url="${escAttr(originalUrl)}">
        <label class="card-checkbox"><input type="checkbox" class="video-cb" onchange="updateBatchBar()"></label>
        ${coverImg}
        <div class="video-info">
            <div class="video-title">${badge} ${escHtml(v.title || T('dl.no_title'))}</div>
            <div class="video-meta">
                <span>👤 ${escHtml(v.author || '?')}</span>
                ${v.type === 'live' ? '<span style="color:var(--red);font-weight:bold;">🔴 LIVE</span>' : `<span>⏱️ ${v.duration || '--'}</span>`}
                <span>📐 ${v.width}×${v.height}</span>
                ${v.play_count > 0 ? `<span>👁️ ${formatCount(v.play_count)}</span>` : ''}
                ${v.like_count > 0 ? `<span>❤️ ${formatCount(v.like_count)}</span>` : ''}
            </div>
            <div class="video-actions">${actionsHtml}</div>
            <div id="prog-${uid}" style="display:none;">
                <div class="progress-bar"><div class="progress-fill" id="fill-${uid}" style="width:0%"></div></div>
                <div style="font-size:11px;color:var(--text3);margin-top:4px;" id="stat-${uid}"></div>
            </div>
        </div>
    </div>`;
}

function renderErrorCard(url, error) {
    return `<div class="video-card" style="border-color:var(--red);">
        <div class="video-thumb" style="display:flex;align-items:center;justify-content:center;font-size:32px;">❌</div>
        <div class="video-info">
            <div class="video-title" style="color:var(--red);">${T('dl.err_parse')}</div>
            <div class="video-meta"><span>${escHtml(url)}</span></div>
            <div style="font-size:12px;color:var(--text3);">${escHtml(error)}</div>
        </div>
    </div>`;
}

// ─── Download ─────────────────────────────────────────────────────────────────
async function downloadVideo(uid, url) {
    const btn = document.querySelector(`#${uid} .btn-download`);
    btn.disabled = true;
    btn.textContent = T('dl.downloading');
    document.getElementById('prog-' + uid).style.display = 'block';

    try {
        const res = await fetch(`${API}/download`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url}),
        });
        const data = await res.json();
        if (data.success) {
            pollProgress(uid, data.task_id);
        } else {
            toast(T('dl.error', {msg: data.detail || 'unknown'}), 'error');
            btn.disabled = false;
            btn.textContent = T('dl.download');
        }
    } catch (e) {
        toast(T('dl.error', {msg: e.message}), 'error');
        btn.disabled = false;
        btn.textContent = T('dl.download');
    }
}

async function pollProgress(uid, taskId) {
    const fill = document.getElementById('fill-' + uid);
    const stat = document.getElementById('stat-' + uid);
    const btn = document.querySelector(`#${uid} .btn-download`);

    const poll = setInterval(async () => {
        try {
            const res = await fetch(`${API}/status/${taskId}`);
            const data = await res.json();
            const t = data.data;
            fill.style.width = t.progress + '%';
            stat.textContent = `${t.progress}% — ${formatSize(t.downloaded)} / ${formatSize(t.total_size)} — ${formatSpeed(t.speed)}`;

            if (t.status === 'done') {
                clearInterval(poll);
                fill.style.width = '100%';
                fill.style.background = 'var(--green)';
                stat.innerHTML = T('dl.complete', {size: formatSize(t.total_size)});
                btn.textContent = T('dl.done');
                btn.style.background = 'var(--green)';
                const actions = document.querySelector(`#${uid} .video-actions`);
                if (actions) {
                    const fname = encodeURIComponent(t.filename || '');
                    actions.innerHTML += ` <button class="btn btn-sm btn-ghost" onclick="copyFileLink('${fname}')" title="${T('dl.copied')}">📋</button>`;
                    actions.innerHTML += ` <a href="${API}/file/${fname}" download class="btn btn-sm btn-ghost" title="${T('dl.download_file')}">💾</a>`;
                }
                toast(T('dl.download_success', {filename: t.filename}));
            } else if (t.status === 'error') {
                clearInterval(poll);
                fill.style.background = 'var(--red)';
                stat.textContent = `❌ ${t.error}`;
                btn.disabled = false;
                btn.textContent = T('dl.retry');
                btn.style.background = '';
            }
        } catch (e) { /* ignore */ }
    }, 500);
}

function copyFileLink(encodedFilename) {
    const link = location.origin + `${API}/file/${encodedFilename}`;
    navigator.clipboard.writeText(link).then(() => toast(T('dl.copy_success')));
}

function copyStream(selId, type) {
    const sel = document.getElementById(selId);
    if (!sel) return;
    const url = type === 'flv' ? sel.options[sel.selectedIndex].getAttribute('data-flv') : sel.value;
    if (!url) { toast(T('dl.no_link', {type: type.toUpperCase()}), 'error'); return; }
    navigator.clipboard.writeText(url).then(() => toast(`📋 ${type.toUpperCase()} ${T('dl.copied')}`));
}

// ─── Live Player ──────────────────────────────────────────────────────────────
function playLive(selId, title, poster) {
    const sel = document.getElementById(selId);
    if (!sel || !sel.value) return toast(T('dl.no_hls'), 'error');
    const hlsUrl = sel.value;

    let playerModal = document.getElementById('live-player-modal');
    if (!playerModal) {
        playerModal = document.createElement('div');
        playerModal.id = 'live-player-modal';
        playerModal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:var(--player-backdrop);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;';
        playerModal.innerHTML = `
            <div style="width:100%;max-width:800px;display:flex;justify-content:space-between;margin-bottom:10px;">
                <h3 id="live-player-title" style="color:var(--player-fg);margin:0;font-size:16px;">Live Stream</h3>
                <button style="background:var(--red);border:none;color:var(--on-accent);cursor:pointer;padding:4px 12px;border-radius:4px;font-weight:bold;" onclick="closeLivePlayer()">✕ Close</button>
            </div>
            <video id="live-video-el" controls autoplay style="width:100%;max-width:800px;max-height:80vh;background:var(--player-stage);border-radius:8px;" poster=""></video>`;
        document.body.appendChild(playerModal);
        if (!window.Hls) {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1';
            document.head.appendChild(s);
        }
    }
    playerModal.style.display = 'flex';
    document.getElementById('live-player-title').textContent = title || 'Live Stream';

    const startPlay = () => {
        const video = document.getElementById('live-video-el');
        if (poster) video.poster = poster;
        if (window.hlsInstance) window.hlsInstance.destroy();
        if (window.Hls && Hls.isSupported()) {
            const hls = new Hls();
            window.hlsInstance = hls;
            hls.loadSource(hlsUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log(e)));
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = hlsUrl;
            video.addEventListener('loadedmetadata', () => video.play().catch(e => console.log(e)));
        } else {
            toast(T('dl.no_browser_support'), 'error');
        }
    };
    if (window.Hls) startPlay(); else setTimeout(startPlay, 1000);
}

window.closeLivePlayer = function() {
    const pm = document.getElementById('live-player-modal');
    if (pm) pm.style.display = 'none';
    if (window.hlsInstance) window.hlsInstance.destroy();
    const video = document.getElementById('live-video-el');
    if (video) video.pause();
};

function clearAll() {
    document.getElementById('url-input').value = '';
    document.getElementById('video-cards').innerHTML = '';
    document.getElementById('batch-bar').style.display = 'none';
    document.getElementById('select-all-cb').checked = false;
}

// ─── Batch ────────────────────────────────────────────────────────────────────
function showBatchBar() {
    const bar = document.getElementById('batch-bar');
    const cards = document.querySelectorAll('.video-cb');
    bar.style.display = cards.length > 0 ? 'flex' : 'none';
    updateBatchBar();
}

function toggleSelectAll(checked) {
    document.querySelectorAll('.video-cb').forEach(cb => { cb.checked = checked; });
    updateBatchBar();
}

function updateBatchBar() {
    const all = document.querySelectorAll('.video-cb');
    const checked = document.querySelectorAll('.video-cb:checked');
    const count = checked.length;
    document.getElementById('batch-count').textContent = T('dl.n_selected', {n: count, total: all.length});
    document.getElementById('btn-download-all').disabled = count === 0;
    const sa = document.getElementById('select-all-cb');
    sa.checked = all.length > 0 && count === all.length;
    sa.indeterminate = count > 0 && count < all.length;
}

async function downloadSelected() {
    const checked = document.querySelectorAll('.video-cb:checked');
    if (checked.length === 0) { toast(T('dl.no_selected'), 'error'); return; }

    const btn = document.getElementById('btn-download-all');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${T('dl.downloading_n', {done: 0, total: checked.length})}`;

    let done = 0;
    for (const cb of checked) {
        const card = cb.closest('.video-card');
        const uid = card.id;
        const url = card.dataset.url;
        if (!url) continue;
        const dlBtn = card.querySelector('.btn-download');
        if (dlBtn && dlBtn.textContent.includes(T('dl.skip_done').slice(0, 4))) { done++; continue; }

        try {
            const res = await fetch(`${API}/download`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url}),
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('prog-' + uid).style.display = 'block';
                if (dlBtn) { dlBtn.disabled = true; dlBtn.textContent = T('dl.downloading'); }
                await waitForDownload(uid, data.task_id);
            }
        } catch (e) {
            toast(T('dl.error', {msg: e.message}), 'error');
        }
        done++;
        btn.innerHTML = `<span class="spinner"></span> ${T('dl.downloading_n', {done, total: checked.length})}`;
    }

    btn.disabled = false;
    btn.innerHTML = `📥 ${T('dl.btn_download_selected')}`;
    toast(T('dl.batch_done', {n: done}));
}

function waitForDownload(uid, taskId) {
    return new Promise((resolve) => {
        const fill = document.getElementById('fill-' + uid);
        const stat = document.getElementById('stat-' + uid);
        const btn = document.querySelector(`#${uid} .btn-download`);
        const poll = setInterval(async () => {
            try {
                const res = await fetch(`${API}/status/${taskId}`);
                const data = await res.json();
                const t = data.data;
                fill.style.width = t.progress + '%';
                stat.textContent = `${t.progress}% — ${formatSize(t.downloaded)} / ${formatSize(t.total_size)} — ${formatSpeed(t.speed)}`;
                if (t.status === 'done') {
                    clearInterval(poll);
                    fill.style.width = '100%';
                    fill.style.background = 'var(--green)';
                    stat.textContent = T('dl.complete', {size: formatSize(t.total_size)});
                    if (btn) { btn.textContent = T('dl.done'); btn.style.background = 'var(--green)'; }
                    resolve();
                } else if (t.status === 'error') {
                    clearInterval(poll);
                    fill.style.background = 'var(--red)';
                    stat.textContent = `❌ ${t.error}`;
                    if (btn) { btn.disabled = false; btn.textContent = T('dl.retry'); }
                    resolve();
                }
            } catch (e) { /* ignore */ }
        }, 500);
    });
}

// ─── History ──────────────────────────────────────────────────────────────────
async function loadHistory() {
    const list = document.getElementById('history-list');
    try {
        const res = await fetch(`${API}/history`);
        const data = await res.json();
        const files = data.data || [];
        if (files.length === 0) {
            list.innerHTML = `<div class="empty-state"><div class="emoji">📂</div><p>${T('dl.empty_history')}</p></div>`;
            return;
        }
        list.innerHTML = files.map(f => `
            <div class="history-item">
                <div class="hi-icon">${f.filename.endsWith('.mp4') ? '🎬' : '🖼️'}</div>
                <div class="hi-info">
                    <div class="hi-name">${escHtml(f.filename)}</div>
                    <div class="hi-size">${formatSize(f.size)} — ${new Date(f.modified * 1000).toLocaleString()}</div>
                </div>
                <div class="hi-actions">
                    <a href="${API}/file/${encodeURIComponent(f.filename)}" download class="btn-icon" title="${T('dl.download_file')}">📥</a>
                    <button class="btn-icon danger" onclick="deleteFile('${escAttr(f.filename)}')" title="Delete">🗑️</button>
                </div>
            </div>`).join('');
    } catch (e) {
        list.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>${T('dl.err_history')}</p></div>`;
    }
}

async function deleteFile(filename) {
    if (!confirm(T('dl.delete_confirm', {filename}))) return;
    try {
        await fetch(`${API}/history/${encodeURIComponent(filename)}`, {method: 'DELETE'});
        toast(T('dl.deleted'));
        loadHistory();
    } catch (e) {
        toast(T('dl.err_delete', {msg: e.message}), 'error');
    }
}

// ─── Settings ─────────────────────────────────────────────────────────────────
async function loadSettings() {
    try {
        const res = await fetch(`${API}/settings`);
        const data = await res.json();
        const s = data.data || {};
        document.getElementById('set-cookie-douyin').value = s.cookie_douyin || '';
        document.getElementById('set-cookie-tiktok').value = s.cookie_tiktok || '';
        document.getElementById('set-proxy').value = s.proxy || '';
    } catch (e) {}
}

async function saveSettings() {
    const body = {};
    const cd = document.getElementById('set-cookie-douyin').value.trim();
    const ct = document.getElementById('set-cookie-tiktok').value.trim();
    const px = document.getElementById('set-proxy').value.trim();
    if (cd && !cd.startsWith('***')) body.cookie_douyin = cd;
    if (ct && !ct.startsWith('***')) body.cookie_tiktok = ct;
    body.proxy = px;

    try {
        await fetch(`${API}/settings`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        toast(T('dl.settings_saved'));
    } catch (e) {
        toast(T('dl.err_save', {msg: e.message}), 'error');
    }
}
</script>
</body>
</html>
