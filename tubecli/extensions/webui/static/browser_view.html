<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Live Browser Stream — TubeCLI</title>
    <script>
    /*
     * Pre-paint theme. Runs BEFORE any stylesheet applies so there is no dark
     * flash when the page is opened in light mode. Contract shared with the
     * other extension pages (file_manager.html): ?theme=glass|light pins
     * data-theme="light" on <html>, ?theme=dark pins dark. With no param a
     * standalone page follows prefers-color-scheme, while an EMBEDDED page
     * (window.self !== top) pins itself dark so a dark host stays coherent.
     */
    (function () {
        try {
            var t = new URLSearchParams(window.location.search).get('theme');
            if (t === 'glass' || t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (window.self !== window.top) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) { /* no URLSearchParams / sandbox quirk: dark default stands */ }
    })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg: #0b0c10;
            --bg-secondary: #1f2833;
            --primary: #66fcf1;
            --primary-hover: #45f3e5;
            --accent: #45a29e;
            --text: #c5c6c7;
            --text-light: #ffffff;
            --text-muted: #9ca3af;
            --border: #2f3e46;
            --red: #ff4d4d;
            --green: #2ecc71;
            --orange: #e67e22;
            /* Surfaces and inks that used to be literals, so the light blocks
               below can restyle them without touching the element rules. */
            --on-primary: #000;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-bg-hover: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.3);
            --badge-bg: rgba(0, 0, 0, 0.25);
            --stage-bg: #08080c;
            --stage-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            /* The Retry button sits ON the preview stage, which is black in
               both themes, so its hairline stays a white ghost either way. */
            --stage-btn-line: rgba(255, 255, 255, 0.2);
            --primary-glow: rgba(102, 252, 241, 0.3);
            --primary-soft: rgba(102, 252, 241, 0.1);
            --danger-soft: rgba(255, 77, 77, 0.1);
            --danger-line: rgba(255, 77, 77, 0.3);
            --tip-bg: rgba(10, 10, 15, 0.9);
            --tip-text: #ffffff;
            --tip-line: rgba(255, 255, 255, 0.1);
            --shadow-elevated: 0 8px 30px rgba(0, 0, 0, 0.5);
            --log-bg: rgba(0, 0, 0, 0.8);
            --log-text: #88c0d0;
            /* Element-picker highlight sits over the remote page image, not
               over chrome, so it is the same in both themes. */
            --inspect-line: #ff3366;
            --inspect-fill: rgba(255, 51, 102, 0.15);
        }

        /* ── Light theme ──────────────────────────────────────────────────
           Values mirror the dashboard glass palette (webui/static/style.css):
           ground #f7f8fa, white panels, ink #1e293b, lines rgba(15,23,42,.1),
           accent #5276EB. Status inks darken so they pass contrast on white.
           Activated by data-theme="light" (set from ?theme= by the pre-paint
           script in <head>); standalone, prefers-color-scheme decides, guarded
           so an explicit data-theme always wins. The two blocks are verbatim
           copies — CSS cannot share a declaration list between them. */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f7f8fa;
            --bg-secondary: #ffffff;
            --primary: #5276EB;
            --primary-hover: #3d5fd4;
            --accent: #5276EB;
            --text: #475569;
            --text-light: #1e293b;
            --text-muted: #64748b;
            --border: rgba(15, 23, 42, 0.1);
            --red: #dc2626;
            --green: #15803d;
            --orange: #b45309;
            --on-primary: #ffffff;
            --btn-bg: rgba(15, 23, 42, 0.04);
            --btn-bg-hover: rgba(15, 23, 42, 0.08);
            --input-bg: rgba(15, 23, 42, 0.04);
            --badge-bg: rgba(15, 23, 42, 0.04);
            --stage-bg: #eef0f4;
            --stage-shadow: 0 4px 20px rgba(15, 23, 42, 0.25);
            --primary-glow: rgba(82, 118, 235, 0.3);
            --primary-soft: rgba(82, 118, 235, 0.15);
            --danger-soft: rgba(220, 38, 38, 0.08);
            --danger-line: rgba(220, 38, 38, 0.3);
            --tip-bg: rgba(255, 255, 255, 0.95);
            --tip-text: #1e293b;
            --tip-line: rgba(15, 23, 42, 0.12);
            --shadow-elevated: 0 8px 30px rgba(15, 23, 42, 0.18);
            --log-bg: rgba(255, 255, 255, 0.92);
            --log-text: #475569;
        }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                color-scheme: light;
                --bg: #f7f8fa;
                --bg-secondary: #ffffff;
                --primary: #5276EB;
                --primary-hover: #3d5fd4;
                --accent: #5276EB;
                --text: #475569;
                --text-light: #1e293b;
                --text-muted: #64748b;
                --border: rgba(15, 23, 42, 0.1);
                --red: #dc2626;
                --green: #15803d;
                --orange: #b45309;
                --on-primary: #ffffff;
                --btn-bg: rgba(15, 23, 42, 0.04);
                --btn-bg-hover: rgba(15, 23, 42, 0.08);
                --input-bg: rgba(15, 23, 42, 0.04);
                --badge-bg: rgba(15, 23, 42, 0.04);
                --stage-bg: #eef0f4;
                --stage-shadow: 0 4px 20px rgba(15, 23, 42, 0.25);
                --primary-glow: rgba(82, 118, 235, 0.3);
                --primary-soft: rgba(82, 118, 235, 0.15);
                --danger-soft: rgba(220, 38, 38, 0.08);
                --danger-line: rgba(220, 38, 38, 0.3);
                --tip-bg: rgba(255, 255, 255, 0.95);
                --tip-text: #1e293b;
                --tip-line: rgba(15, 23, 42, 0.12);
                --shadow-elevated: 0 8px 30px rgba(15, 23, 42, 0.18);
                --log-bg: rgba(255, 255, 255, 0.92);
                --log-text: #475569;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header / Toolbar */
        .toolbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: var(--text-light);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--btn-bg-hover);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--on-primary);
            font-weight: 600;
            border: none;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            color: var(--on-primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-danger {
            background: var(--danger-soft);
            color: var(--red);
            border-color: var(--danger-line);
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
            box-shadow: 0 0 10px var(--danger-line);
        }

        .btn-icon {
            padding: 8px;
            border-radius: 50%;
        }

        .url-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 12px;
            gap: 8px;
            transition: border-color 0.2s ease;
        }

        .url-bar-container:focus-within {
            border-color: var(--primary);
        }

        .url-bar-container input {
            background: transparent;
            border: none;
            color: var(--text-light);
            width: 100%;
            font-size: 0.95rem;
            outline: none;
        }

        .url-bar-container .material-symbols-outlined {
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--orange);
            display: inline-block;
        }

        .status-dot.active {
            background-color: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .status-dot.offline {
            background-color: var(--red);
            box-shadow: 0 0 8px var(--red);
        }

        /* Main View Container */
        .container {
            flex: 1;
            position: relative;
            background-color: var(--stage-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #previewCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #000;
            box-shadow: var(--stage-shadow);
            outline: none;
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        /* Element Inspect Overlay overlays on the canvas relative positions */
        #inspectOverlay {
            position: absolute;
            pointer-events: none;
            border: 2px solid var(--inspect-line);
            background: var(--inspect-fill);
            display: none;
            z-index: 10;
            box-shadow: 0 0 8px var(--primary-glow);
            border-radius: 2px;
            transition: all 0.05s ease;
        }

        #inspectInfo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--tip-bg);
            border: 1px solid var(--tip-line);
            color: var(--tip-text);
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 8px;
            z-index: 20;
            display: none;
            max-width: 80%;
            box-shadow: var(--shadow-elevated);
            backdrop-filter: blur(10px);
        }

        /* Log Panel */
        .log-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            max-height: 150px;
            background: var(--log-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: var(--log-text);
            padding: 8px 12px;
            overflow-y: auto;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-line {
            line-height: 1.4;
            word-break: break-all;
        }
        .log-line.success { color: var(--green); }
        .log-line.error { color: var(--red); }

        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="/static/i18n.js"></script>
</head>
<body>

    <!-- Loading Indicator -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div data-i18n="browser.initializing" style="font-size: 1.1rem; color: var(--text-light); font-weight: 500;">Initializing browser...</div>
        <div id="loader-subtext" data-i18n="browser.please_wait" style="font-size: 0.85rem; color: var(--accent);">Please wait a moment</div>
    </div>

    <!-- Top Navigation / URL Bar -->
    <div class="toolbar">
        <button class="btn btn-icon" onclick="navigateAction('back')" title="Back">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <button class="btn btn-icon" onclick="navigateAction('forward')" title="Forward">
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <button class="btn btn-icon" onclick="navigateAction('reload')" title="Reload">
            <span class="material-symbols-outlined">refresh</span>
        </button>

        <div class="url-bar-container">
            <span class="material-symbols-outlined">language</span>
            <input type="text" id="urlInput" data-i18n-placeholder="browser.url_placeholder" placeholder="Enter URL address..." onkeydown="if(event.key==='Enter') navigateToUrl()">
        </div>

        <button id="btnPicker" class="btn" onclick="toggleElementPicker()" title="Select element">
            <span class="material-symbols-outlined">target</span> <span data-i18n="browser.select_element">Select Element</span>
        </button>

        <button class="btn" onclick="takeScreenshot()" title="Take Screenshot">
            <span class="material-symbols-outlined">screenshot_keyboard</span> <span data-i18n="browser.take_screenshot">Take Screenshot</span>
        </button>

        <div class="status-badge">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Connecting</span>
        </div>

        <button class="btn btn-danger" onclick="stopBrowser()" title="Turn Off">
            <span class="material-symbols-outlined">power_settings_new</span> <span data-i18n="browser.turn_off">Turn Off</span>
        </button>
    </div>

    <!-- Main Live Screen Stream -->
    <div class="container" id="screenContainer">
        <div id="canvasWrapper" style="position:relative; display:inline-block; max-width:100%; max-height:100%; line-height:0;">
            <canvas id="previewCanvas" style="cursor: default; max-width: 100%; max-height: 100%; object-fit: contain; background: #000; box-shadow: var(--stage-shadow); outline: none; border-radius: 2px;"></canvas>
            <!-- Fallback frame, shown when the CDP screencast is unavailable and the
                 page falls back to polling screenshots. The script has always
                 referenced #previewImg, but the element was never in the markup, so
                 startScreenshotStream() threw on null and the fallback could never
                 run — leaving the page stuck on "Initializing browser...". -->
            <img id="previewImg" alt="" style="display:none; max-width:100%; max-height:100%; object-fit:contain; background:#000; box-shadow:var(--stage-shadow); border-radius:2px;" />
            <div id="inspectOverlay" style="position:absolute;pointer-events:none;border:2px solid var(--inspect-line);background:var(--inspect-fill);display:none;z-index:10;box-sizing:border-box;"></div>
        </div>
        <div id="inspectInfo" style="position:absolute;bottom:15px;left:15px;background:var(--tip-bg);color:var(--tip-text);padding:12px;border-radius:8px;font:13px monospace;z-index:10;pointer-events:none;display:none;border:1px solid var(--tip-line);box-shadow:var(--shadow-elevated);"></div>
    </div>

    <!-- Floating Logs -->
    <div class="log-panel" id="logPanel">
        <div class="log-line success" data-i18n="browser.init_ws_control">Initializing WebSocket Control...</div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const params = new URLSearchParams(window.location.search);
        const profile = params.get('profile') || 'default';
        const startUrl = params.get('url') || 'https://google.com';

        let ws = null;
        let previewSession = null;
        let pickerActive = false;
        let scaleX = 1;
        let scaleY = 1;
        let cssViewport = null;
        let isWSConnected = false;
        let screenshotInterval = null;

        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        // ── Frame rendering ────────────────────────────────────────────
        //
        // Frames used to arrive as base64 inside JSON and be drawn through a
        // fresh `new Image()` with a data: URI each time — five per second, each
        // one a new image resource the browser had to allocate, decode on the
        // main thread and later collect. A live session measured 177 frames /
        // 19.2 MB in about half a minute.
        //
        // createImageBitmap decodes off the main thread and, unlike an Image,
        // owns memory that can be released deliberately: close() the bitmap the
        // moment it has been drawn, so nothing accumulates however long the view
        // is left open. `drawing` drops a frame rather than queueing it — for a
        // live view the newest frame is the only one worth having.
        let drawing = false;

        function paint(bitmap) {
            if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
                canvas.width = bitmap.width;
                canvas.height = bitmap.height;
            }
            ctx.drawImage(bitmap, 0, 0);
            const rect = canvas.getBoundingClientRect();
            scaleX = bitmap.width / rect.width;
            scaleY = bitmap.height / rect.height;
            bitmap.close();          // the whole point — free it now
        }

        async function drawFrameFromBlob(blob) {
            if (drawing) return;     // still painting the previous one; skip
            drawing = true;
            try {
                if (loader.style.display !== 'none') {
                    statusText.textContent = 'Live (WS)';
                    loader.style.opacity = 0;
                    setTimeout(() => loader.style.display = 'none', 500);
                }
                paint(await createImageBitmap(blob));
            } catch (e) {
                // Fall back rather than freeze if createImageBitmap is missing.
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => { paintImage(img); URL.revokeObjectURL(url); };
                img.onerror = () => URL.revokeObjectURL(url);
                img.src = url;
            } finally {
                drawing = false;
            }
        }

        function paintImage(img) {
            if (canvas.width !== img.width || canvas.height !== img.height) {
                canvas.width = img.width;
                canvas.height = img.height;
            }
            ctx.drawImage(img, 0, 0);
            const rect = canvas.getBoundingClientRect();
            scaleX = img.width / rect.width;
            scaleY = img.height / rect.height;
        }

        // Kept for any older server still sending base64 in JSON.
        function drawFrameFromBase64(data) {
            const img = new Image();
            img.onload = () => paintImage(img);
            img.src = 'data:image/jpeg;base64,' + data;
        }
        const imgFallback = document.getElementById('previewImg');
        const loader = document.getElementById('loader');
        const loaderSub = document.getElementById('loader-subtext');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const urlInput = document.getElementById('urlInput');
        const btnPicker = document.getElementById('btnPicker');
        const overlay = document.getElementById('inspectOverlay');
        const infoBox = document.getElementById('inspectInfo');
        const logPanel = document.getElementById('logPanel');

        // Newest 300 lines only. A view left open all day otherwise grows a DOM
        // node per line forever, and nobody scrolls back that far anyway.
        const MAX_LOG_LINES = 300;

        function appendLog(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `log-line ${type}`;
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logPanel.appendChild(el);
            while (logPanel.childElementCount > MAX_LOG_LINES) {
                logPanel.removeChild(logPanel.firstElementChild);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Wait for the one-time npm install to finish, then launch. Shows npm's own
        // last line so a multi-minute step reads as progress rather than a freeze.
        async function pollDepsThenRetry() {
            for (let i = 0; i < 90; i++) {                 // ~7.5 minutes
                await new Promise(r => setTimeout(r, 5000));
                let s;
                try {
                    s = await (await fetch(`${API_BASE}/api/v1/browser/deps/status`)).json();
                } catch (e) { continue; }

                if (s.installed) {
                    appendLog('Browser dependencies installed.', 'success');
                    loaderSub.style.color = '';
                    initBrowser();
                    return;
                }
                if (s.error) {
                    loaderSub.style.color = 'var(--red)';
                    loaderSub.style.whiteSpace = 'pre-line';
                    loaderSub.textContent = s.error;
                    appendLog(s.error, 'error');
                    return;
                }
                const last = (s.log || []).filter(Boolean).pop();
                if (last) loaderSub.textContent = 'Installing browser automation...\n' + last;
            }
            loaderSub.style.color = 'var(--red)';
            loaderSub.textContent = 'Dependency install is taking unusually long. '
                + 'Check the server log for npm output.';
        }

        // Initialize & Launch Browser via API
        async function initBrowser() {
            try {
                appendLog(T('browser.sending_launch_req', { profile: profile }));
                const res = await fetch(`${API_BASE}/api/v1/browser/preview/launch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profile, url: startUrl })
                });
                
                const data = await res.json();

                // 503 means the server is setting itself up (installing the npm
                // dependencies, which pulls browser binaries and takes minutes).
                // Wait and retry instead of turning a one-time setup step into a
                // dead end the user has to resolve by hand.
                if (res.status === 503) {
                    loaderSub.style.color = 'var(--text-muted)';
                    loaderSub.textContent = data.detail || 'Preparing browser automation...';
                    appendLog(data.detail || 'Installing browser dependencies...', 'info');
                    pollDepsThenRetry();
                    return;
                }

                if (res.ok && data.status === 'launched' && data.port) {
                    previewSession = data;
                    appendLog(T('browser.started_on_port', { port: data.port }), 'success');
                    connectWebSocket(data.port);
                } else {
                    throw new Error(data.error || data.detail || T('browser.cannot_launch'));
                }
            } catch (e) {
                appendLog(T('browser.launch_error', { error: e.message }), 'error');
                loaderSub.textContent = T('browser.error', { error: e.message });
                loaderSub.style.color = 'var(--red)';
                // The server now returns the reason node failed to start, which is
                // several lines of its own output — keep the newlines readable
                // instead of collapsing it into one unreadable run.
                loaderSub.style.whiteSpace = 'pre-line';
                loaderSub.style.textAlign = 'left';
                loaderSub.style.maxWidth = '680px';
                loaderSub.style.margin = '8px auto 0';
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Launch Error';
            }
        }

        // Connect WebSocket Proxy
        function connectWebSocket(port) {
            if (ws) {
                try { ws.close(); } catch(e) {}
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/v1/browser/preview/ws/${port}`;
            
            appendLog(T('browser.init_ws_control') + ' ' + wsUrl + '...');
            ws = new WebSocket(wsUrl);

            // 5 s was too short — the preview server accepts the socket only once
            // its browser is ready, and a cold ShardX start on a container takes
            // longer than that. Give it 30 s, then report rather than falling into
            // a screenshot loop that could not work either.
            const wsTimeout = setTimeout(() => {
                if (ws && ws.readyState !== WebSocket.OPEN) {
                    try { ws.close(); } catch(e) {}
                    ws = null;
                    showPreviewFailure(
                        'The preview WebSocket did not open within 30s. The browser '
                        + 'engine may have failed to start — check the server log for '
                        + '[PreviewServer] lines.');
                }
            }, 30000);

            ws.onopen = () => {
                clearTimeout(wsTimeout);
                isWSConnected = true;
                statusDot.className = 'status-dot active';
                statusText.textContent = 'Initializing...';
                appendLog(T('browser.ws_connected_success'), 'success');
            };

            ws.binaryType = 'blob';
            ws.onmessage = (event) => {
                try {
                    // Frames arrive as raw bytes now; everything else is JSON.
                    if (typeof event.data !== 'string') {
                        drawFrameFromBlob(event.data);
                        return;
                    }
                    const msg = JSON.parse(event.data);

                    if (msg.type === 'status_log') {
                        loaderSub.textContent = msg.message;
                        appendLog(`[Browser] ${msg.message}`);
                    }
                    else if (msg.type === 'selection') {
                        // Kept ready so the copy handler can answer synchronously.
                        lastRemoteSelection = msg.text || '';
                    }
                    else if (msg.type === 'browser_ready') {
                        statusText.textContent = 'Live (WS)';
                        loader.style.opacity = 0;
                        setTimeout(() => loader.style.display = 'none', 500);
                        appendLog(T('browser.ready_success'), 'success');
                    }
                    else if (msg.type === 'frame') {
                        // Hide loader if still visible when receiving frames
                        if (loader.style.display !== 'none') {
                            statusText.textContent = 'Live (WS)';
                            loader.style.opacity = 0;
                            setTimeout(() => loader.style.display = 'none', 500);
                        }
                        
                        if (msg.viewport) {
                            cssViewport = msg.viewport;
                        }
                        
                        drawFrameFromBase64(msg.data);
                    }
                    else if (msg.type === 'viewport') {
                        // Sent on its own now, and only when it changes, instead
                        // of riding along with every single frame.
                        cssViewport = msg.viewport || cssViewport;
                    }
                    else if (msg.type === 'url_changed') {
                        urlInput.value = msg.url || '';
                    }
                    else if (msg.type === 'inspect') {
                        // Element highlights
                        if (cssViewport && canvas.width) {
                            const rect = canvas.getBoundingClientRect();
                            const cw = canvas.width;
                            const ch = canvas.height;
                            const displayAspect = rect.width / rect.height;
                            const canvasAspect = cw / ch;
                            
                            let renderW, renderH, offsetX, offsetY;
                            if (canvasAspect > displayAspect) {
                                renderW = rect.width;
                                renderH = rect.width / canvasAspect;
                                offsetX = 0;
                                offsetY = (rect.height - renderH) / 2;
                            } else {
                                renderH = rect.height;
                                renderW = rect.height * canvasAspect;
                                offsetX = (rect.width - renderW) / 2;
                                offsetY = 0;
                            }
                            
                            const pctX = msg.rect.x / cssViewport.width;
                            const pctY = msg.rect.y / cssViewport.height;
                            const pctW = (msg.rect.width || msg.rect.w) / cssViewport.width;
                            const pctH = (msg.rect.height || msg.rect.h) / cssViewport.height;
                            
                            overlay.style.display = 'block';
                            overlay.style.left = (offsetX + pctX * renderW) + 'px';
                            overlay.style.top = (offsetY + pctY * renderH) + 'px';
                            overlay.style.width = (pctW * renderW) + 'px';
                            overlay.style.height = (pctH * renderH) + 'px';
                        }
                        infoBox.style.display = 'block';
                        infoBox.textContent = `<${msg.tag}${msg.id ? '#' + msg.id : ''}${msg.classes ? '.' + msg.classes.split(' ')[0] : ''}> ${msg.text}`;
                    }
                    else if (msg.type === 'picked') {
                        appendLog(T('browser.select_element') + ': ' + msg.selector, 'success');
                        // Copy to clipboard
                        navigator.clipboard.writeText(msg.selector).then(() => {
                            appendLog(T('browser.copied_selector'), 'info');
                        });
                        toggleElementPicker(false);
                    }
                    else if (msg.type === 'file_chooser_open') {
                        appendLog(T('browser.upload_request'), 'info');
                        const fileInput = document.createElement('input');
                        fileInput.type = 'file';
                        fileInput.style.display = 'none';
                        fileInput.multiple = msg.multiple;
                        document.body.appendChild(fileInput);

                        fileInput.onchange = async () => {
                            const files = fileInput.files;
                            if (files.length === 0) {
                                ws.send(JSON.stringify({ type: 'file_cancel' }));
                                document.body.removeChild(fileInput);
                                return;
                            }

                            appendLog(T('browser.uploading_files', { count: files.length }));
                            try {
                                const formData = new FormData();
                                for (const file of files) {
                                    formData.append('files', file);
                                }

                                const response = await fetch(`${API_BASE}/api/v1/browser/preview/upload/${previewSession.port}`, {
                                    method: 'POST',
                                    body: formData
                                });

                                if (!response.ok) {
                                    const errData = await response.json().catch(() => ({}));
                                    throw new Error(errData.detail || errData.error || `HTTP ${response.status}`);
                                }

                                appendLog(T('browser.uploaded_success', { count: files.length }), 'success');
                            } catch (err) {
                                appendLog(T('browser.upload_error', { error: err.message }), 'error');
                                ws.send(JSON.stringify({ type: 'file_cancel' }));
                            }
                            document.body.removeChild(fileInput);
                        };

                        fileInput.click();
                    }
                } catch(e) {}
            };

            ws.onclose = (ev) => {
                isWSConnected = false;
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Disconnected';
                appendLog(T('browser.ws_disconnected'), 'error');
                // A close carries the reason the proxy attached; show it instead of
                // starting a poll loop against a server that just went away.
                const why = (ev && ev.reason) ? ev.reason : '';
                showPreviewFailure('Preview connection closed.' + (why ? ' ' + why : ''));
            };

            ws.onerror = (e) => {
                appendLog(T('browser.ws_error'), 'error');
            };
        }

        // Send a control command through the API, which runs on the machine that
        // owns the preview port. Posting to http://localhost:<port> from the page
        // only worked when the dashboard and the browser were the same machine;
        // over a container or any remote host it was ERR_CONNECTION_REFUSED.
        async function previewControl(action, body) {
            if (!previewSession) return null;
            try {
                const r = await fetch(
                    `${API_BASE}/api/v1/browser/preview/control/${previewSession.port}/${action}`,
                    { method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(body || {}) });
                if (!r.ok) {
                    const d = await r.json().catch(() => ({}));
                    appendLog(`${action} failed: ${d.detail || r.status}`, 'error');
                }
                return r;
            } catch (e) {
                appendLog(`${action} failed: ${e.message}`, 'error');
                return null;
            }
        }

        // The screenshot polling fallback is gone. It fired once a second forever,
        // and when the preview server was not answering — the only situation it
        // ever ran in — that was an unbounded stream of 502s in the console with
        // nothing on screen and no indication of what was wrong. Say what happened
        // and offer a retry instead of hammering a dead endpoint.
        function showPreviewFailure(reason) {
            stopScreenshotStream();
            appendLog(reason, 'error');
            if (statusDot) statusDot.className = 'status-dot offline';
            if (statusText) statusText.textContent = 'Disconnected';
            if (!loader) return;
            loader.style.display = 'flex';
            loader.style.opacity = 1;
            const sub = document.getElementById('loader-subtext');
            if (sub) {
                sub.style.color = 'var(--red)';
                sub.style.whiteSpace = 'pre-line';
                sub.textContent = reason + '\n\nThe live view could not be established.';
            }
            const title = loader.querySelector('h3, .loader-title');
            if (title) title.textContent = 'Preview unavailable';
            if (!document.getElementById('previewRetryBtn') && sub && sub.parentNode) {
                const btn = document.createElement('button');
                btn.id = 'previewRetryBtn';
                btn.textContent = 'Retry';
                btn.style.cssText = 'margin-top:14px;padding:8px 22px;border-radius:6px;'
                    + 'border:1px solid var(--stage-btn-line);background:var(--primary);color:var(--on-primary);cursor:pointer';
                btn.onclick = () => { btn.remove(); location.reload(); };
                sub.parentNode.appendChild(btn);
            }
        }

        // Kept as a no-op so older call sites cannot resurrect the polling loop.
        function startScreenshotStream(port) {
            showPreviewFailure('Live preview stream (WebSocket) could not be established.');
        }

        function stopScreenshotStream() {
            if (screenshotInterval) {
                clearInterval(screenshotInterval);
                screenshotInterval = null;
            }
        }

        // Convert UI click/coordinates back to real browser coordinates
        function translateCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const cw = canvas.width;
            const ch = canvas.height;
            const displayAspect = rect.width / rect.height;
            const canvasAspect = cw / ch;
            
            let renderW, renderH, offsetX, offsetY;
            if (canvasAspect > displayAspect) {
                renderW = rect.width;
                renderH = rect.width / canvasAspect;
                offsetX = 0;
                offsetY = (rect.height - renderH) / 2;
            } else {
                renderH = rect.height;
                renderW = rect.height * canvasAspect;
                offsetX = (rect.width - renderW) / 2;
                offsetY = 0;
            }
            
            const localX = e.clientX - rect.left - offsetX;
            const localY = e.clientY - rect.top - offsetY;
            const pctX = Math.max(0, Math.min(1, localX / renderW));
            const pctY = Math.max(0, Math.min(1, localY / renderH));
            
            if (cssViewport) {
                return {
                    x: pctX * cssViewport.width,
                    y: pctY * cssViewport.height
                };
            }
            return {
                x: pctX * cw,
                y: pctY * ch
            };
        }

        // Forward Interactions to server
        let isMouseDown = false;

        canvas.addEventListener('mousedown', (e) => {
            if (!ws || !isWSConnected || pickerActive) return;
            isMouseDown = true;
            const { x, y } = translateCoordinates(e);
            
            ws.send(JSON.stringify({ type: 'mouse', action: 'move', x, y }));
            ws.send(JSON.stringify({ type: 'mouse', action: 'down' }));
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!ws || !isWSConnected) return;
            const { x, y } = translateCoordinates(e);
            
            if (pickerActive) {
                ws.send(JSON.stringify({ type: 'hover_inspect', x, y }));
                return;
            }
            
            if (isMouseDown) {
                ws.send(JSON.stringify({ type: 'mouse', action: 'move', x, y }));
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!ws || !isWSConnected || pickerActive) return;
            isMouseDown = false;
            const { x, y } = translateCoordinates(e);
            
            ws.send(JSON.stringify({ type: 'mouse', action: 'move', x, y }));
            ws.send(JSON.stringify({ type: 'mouse', action: 'up' }));
            // Releasing the button is when a drag-selection is finished; ask for
            // it now so a following Ctrl+C has something to hand over.
            ws.send(JSON.stringify({ type: 'get_selection' }));
        });

        canvas.addEventListener('dblclick', (e) => {
            if (!ws || !isWSConnected || pickerActive) return;
            const { x, y } = translateCoordinates(e);
            ws.send(JSON.stringify({ type: 'mouse', action: 'dblclick', x, y }));
        });

        canvas.addEventListener('click', (e) => {
            if (!ws || !isWSConnected) return;
            const { x, y } = translateCoordinates(e);
            
            if (pickerActive) {
                ws.send(JSON.stringify({ type: 'pick_element', x, y }));
            }
        });

        canvas.addEventListener('mouseleave', () => {
            overlay.style.display = 'none';
            infoBox.style.display = 'none';
        });

        canvas.addEventListener('wheel', (e) => {
            if (!ws || !isWSConnected) return;
            e.preventDefault();
            ws.send(JSON.stringify({ type: 'scroll', deltaX: e.deltaX, deltaY: e.deltaY }));
        }, { passive: false });

        // Keyboard inputs (ensure canvas is focused)
        canvas.setAttribute('tabindex', '0');
        canvas.addEventListener('keydown', (e) => {
            if (!ws || !isWSConnected) return;

            // BEFORE preventDefault, not after. Cancelling the default action of
            // a Ctrl/Cmd+V keydown cancels the paste itself, so the browser never
            // fires the 'paste' event and the listener that reads the clipboard
            // never runs. The first version of this check sat below the
            // preventDefault on line 816 and was therefore dead code — the
            // handler was correct and had already been disarmed.
            // Same for copy and cut: let the browser do its part.
            if ((e.ctrlKey || e.metaKey) && ['v', 'V', 'c', 'C', 'x', 'X'].includes(e.key)) {
                return;
            }

            e.preventDefault();

            const modifierKeys = ['Control', 'Shift', 'Alt', 'Meta'];
            if (modifierKeys.includes(e.key)) {
                return; // Ignore raw modifier keys to prevent duplicate actions
            }
            
            const modifiers = [];
            if (e.ctrlKey) modifiers.push('Control');
            if (e.shiftKey) modifiers.push('Shift');
            if (e.altKey) modifiers.push('Alt');
            if (e.metaKey) modifiers.push('Meta');
            
            let keyName = e.key;
            if (keyName === ' ') keyName = 'Space';
            
            if (modifiers.length > 0) {
                const combo = modifiers.join('+') + '+' + keyName;
                ws.send(JSON.stringify({ type: 'keyboard', action: 'press', key: combo }));
            } else {
                if (e.key.length === 1) {
                    ws.send(JSON.stringify({ type: 'keyboard', action: 'type', text: e.key }));
                } else {
                    ws.send(JSON.stringify({ type: 'keyboard', action: 'press', key: e.key }));
                }
            }
        });

        // Whatever the remote page currently has selected, refreshed on mouseup
        // and on Ctrl+A. Needed because a copy event must produce its data
        // synchronously — there is no time to ask the server mid-event.
        let lastRemoteSelection = '';

        // Paste: carry the TEXT across, not the keystroke.
        //
        // The paste event's clipboardData is readable on a plain-http origin;
        // navigator.clipboard.readText() is not, because it is a secure-context
        // API and this dashboard is reached by IP over http. So this listener is
        // the only way paste can work here at all — and it is also the correct
        // way, since the remote browser has no idea what is on your clipboard.
        // On DOCUMENT, not on the canvas. A paste event is delivered to whatever
        // would receive the text — an input, a contenteditable, otherwise the
        // document. A <canvas> is none of those, so a listener bound to it never
        // fired and Ctrl+V appeared to do nothing at all. tabindex makes the
        // canvas focusable for KEYS; it does not make it a paste target.
        document.addEventListener('paste', (e) => {
            if (!ws || !isWSConnected) return;
            // Do not steal the paste while the user is typing in the URL bar or
            // any other real field on this page.
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
            if (!text) return;
            // insertText, not type: a long paste typed key-by-key is slow and
            // fires a keydown storm that some sites debounce into losing input.
            ws.send(JSON.stringify({ type: 'keyboard', action: 'insert', text }));
            appendLog(`[Paste] ${text.length} ký tự → trình duyệt từ xa`);
        });

        // Copy the other way: when the remote page has a selection, Ctrl+C asks
        // for it and puts it on YOUR clipboard. Same reasoning — bind to the
        // document, and stand aside for real fields on this page.
        document.addEventListener('copy', (e) => {
            if (!ws || !isWSConnected) return;
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
            if (lastRemoteSelection) {
                e.preventDefault();
                e.clipboardData.setData('text/plain', lastRemoteSelection);
            }
        });

        // Trigger Navigations
        async function navigateToUrl() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!/^https?:\/\//i.test(url) && url !== 'about:blank') {
                url = 'https://' + url;
                urlInput.value = url;
            }
            
            appendLog(T('browser.navigating_to', { url: url }));
            if (ws && isWSConnected) {
                ws.send(JSON.stringify({ type: 'navigate', url }));
            } else if (previewSession) {
                await previewControl('navigate', { url });
            }
        }

        function navigateAction(action) {
            if (ws && isWSConnected) {
                ws.send(JSON.stringify({ type: 'nav', action }));
                appendLog(T('browser.sending_nav_command', { action: action }));
            }
        }

        // Toggles Element Picker
        async function toggleElementPicker(forcedState) {
            pickerActive = (forcedState !== undefined) ? forcedState : !pickerActive;
            
            if (pickerActive) {
                btnPicker.classList.add('btn-primary');
                canvas.style.cursor = 'crosshair';
                appendLog(T('browser.picker_on'), 'info');
                
                // Let node server start picker
                if (previewSession) await previewControl('pick/start');
            } else {
                btnPicker.classList.remove('btn-primary');
                canvas.style.cursor = 'default';
                overlay.style.display = 'none';
                infoBox.style.display = 'none';
                appendLog(T('browser.picker_off'), 'info');
                
                // Let node server stop picker
                if (previewSession) await previewControl('pick/stop');
            }
        }

        function takeScreenshot() {
            if (previewSession) {
                window.open(`${API_BASE}/api/v1/browser/preview/screenshot/${previewSession.port}`, '_blank');
            }
        }

        // Close Browser / Clean Up
        async function stopBrowser() {
            if (!previewSession) return;
            appendLog(T('browser.stopping'));
            try {
                await fetch(`${API_BASE}/api/v1/browser/preview/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: previewSession.session_id })
                });
                ws = null;
                isWSConnected = false;
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Offline';
                appendLog(T('browser.stopped_success'), 'success');
                alert(T('browser.stopped_clean'));
                window.close();
            } catch(e) {
                appendLog(T('browser.stop_error', { error: e.message }), 'error');
            }
        }

        // Clean up on tab close
        window.addEventListener('beforeunload', () => {
            if (previewSession) {
                // Async send fire-and-forget beacon to stop preview
                navigator.sendBeacon(`${API_BASE}/api/v1/browser/preview/stop`, JSON.stringify({ session_id: previewSession.session_id }));
            }
        });

        // Auto init
        window.onload = async () => {
            try {
                await loadI18nFromApi();
            } catch (e) {
                console.warn("Failed to load i18n:", e);
            }
            initBrowser();
        };
    </script>
</body>
</html>
