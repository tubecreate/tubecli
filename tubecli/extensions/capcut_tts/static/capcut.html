<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapCut TTS</title>
<style>
/* Uses the DASHBOARD's CSS variables (--bg, --bg2, --bg3, --text, --border,
   --accent, --green, --red…). When embedded, syncThemeToIframe injects the
   dashboard's live values with !important, so the page follows the dashboard
   theme exactly. The :root block below is only a fallback for opening the page
   standalone; the dark media query keeps that case readable too. Semantic
   backgrounds use color-mix on the accent/semantic color so they adapt to
   whatever ground the theme sets, without needing their own dark variant. */
:root {
  --bg: #f4f6f9; --bg2: #ffffff; --bg3: #eef1f5;
  --text: #1a1f2b; --text-muted: #5a6474; --border: #dde2ea;
  --accent: #2d7ff9; --green: #1f9d55; --red: #d23b3b; --orange: #b5720f; --cyan: #0e7c9a;
  --radius: 12px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --bg2: #171d27; --bg3: #10151d;
    --text: #e6eaf0; --text-muted: #a4adbc; --border: #262d39;
    --accent: #4f9bff; --green: #4cc47f; --red: #ff6b6b; --orange: #dca84a; --cyan: #57c4e0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 18px 60px; }
h1 { font-size: 1.35rem; margin: 0 0 2px; letter-spacing: -.01em; }
.sub { color: var(--text-muted); font-size: .85rem; margin: 0 0 18px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab { padding: 9px 16px; border: none; background: none; color: var(--text-muted); font-size: .92rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.panel { display: none; }
.panel.on { display: block; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-muted); margin: 0 0 4px; }
input, select, textarea { width: 100%; padding: 9px 11px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: .92rem; font-family: var(--sans); }
textarea { resize: vertical; min-height: 90px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.fg { margin-bottom: 12px; }
button.btn { padding: 9px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: .9rem; cursor: pointer; }
button.btn:disabled { opacity: .55; cursor: not-allowed; }
button.ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
button.sm { padding: 4px 10px; font-size: .8rem; }
button.danger { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag.on { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.tag.off { background: var(--bg3); color: var(--text-muted); }
.acc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.acc:last-child { border-bottom: none; }
.acc .who { font-weight: 600; font-size: .9rem; }
.acc .meta { font-size: .76rem; color: var(--text-muted); font-family: var(--mono); }
.acc .actions { display: flex; gap: 6px; flex-shrink: 0; }
.msg { font-size: .84rem; padding: 8px 11px; border-radius: 8px; margin-top: 8px; display: none; }
.msg.ok { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); display: block; }
.msg.warn { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); display: block; }
.msg.err { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); display: block; }
.empty { text-align: center; color: var(--text-muted); padding: 26px 0; font-size: .9rem; }
.hist { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.hist audio { height: 34px; }
.hint { font-size: .78rem; color: var(--text-muted); margin-top: 3px; }
#syn-audio { width: 100%; margin-top: 12px; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 5px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ CapCut TTS</h1>
  <p class="sub">Chuyển văn bản thành giọng nói qua tài khoản CapCut của bạn. Tài khoản lưu mã hoá trên máy, chỉ gửi tới CapCut.</p>

  <div class="tabs">
    <button class="tab on" data-tab="synth">Tổng hợp</button>
    <button class="tab" data-tab="accounts">Tài khoản</button>
    <button class="tab" data-tab="history">Lịch sử</button>
  </div>

  <!-- ── SYNTHESIZE ── -->
  <div class="panel on" id="panel-synth">
    <div class="card">
      <div class="row">
        <div class="fg"><label>Tài khoản</label><select id="syn-account"></select></div>
        <div class="fg"><label>Ngôn ngữ</label><select id="syn-lang"><option value="">Tất cả</option></select></div>
      </div>
      <div class="fg">
        <label>Giọng đọc</label>
        <div class="row" style="align-items:flex-end">
          <select id="syn-speaker" style="flex:4"></select>
          <button class="btn ghost sm" id="btn-preview" style="flex:0 0 auto" onclick="previewVoice()" title="Nghe thử">▶ Nghe thử</button>
        </div>
        <div class="hint" id="speaker-count"></div>
      </div>
      <div class="fg"><label>Nội dung cần đọc</label><textarea id="syn-text" placeholder="Nhập văn bản..."></textarea></div>
      <div class="row">
        <div class="fg"><label>Tốc độ (1–20, 10 = 1.0x)</label><input type="number" id="syn-speed" value="10" min="1" max="20"></div>
        <div class="fg"><label>Âm lượng (0–20, 10 = chuẩn)</label><input type="number" id="syn-volume" value="10" min="0" max="20"></div>
      </div>
      <button class="btn" id="btn-synth" onclick="doSynthesize()">🔊 Tổng hợp giọng nói</button>
      <div class="msg" id="syn-msg"></div>
      <audio id="syn-audio" controls style="display:none"></audio>
    </div>
  </div>

  <!-- ── ACCOUNTS ── -->
  <div class="panel" id="panel-accounts">
    <div class="card">
      <label style="margin-bottom:10px;font-size:.95rem;color:var(--text)">Thêm tài khoản CapCut</label>
      <div class="fg"><label>Email</label><input id="acc-email" type="email" placeholder="you@example.com" autocomplete="off"></div>
      <div class="fg"><label>Mật khẩu CapCut</label><input id="acc-pass" type="password" placeholder="Mật khẩu tài khoản CapCut" autocomplete="new-password"></div>
      <div class="fg"><label>Nhãn (tuỳ chọn)</label><input id="acc-label" placeholder="vd: tài khoản chính"></div>
      <button class="btn" id="btn-add-acc" onclick="addAccount()">Lưu tài khoản</button>
      <div class="msg" id="acc-msg"></div>
    </div>
    <div class="card">
      <label style="font-size:.95rem;color:var(--text);margin-bottom:8px">Tài khoản đã lưu</label>
      <div id="acc-list"><div class="empty">Đang tải...</div></div>
    </div>
  </div>

  <!-- ── HISTORY ── -->
  <div class="panel" id="panel-history">
    <div class="card">
      <label style="font-size:.95rem;color:var(--text);margin-bottom:8px">File đã tạo</label>
      <div id="hist-list"><div class="empty">Đang tải...</div></div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1/capcut-tts';
const $ = id => document.getElementById(id);
async function api(path, opts) {
  const r = await fetch(API + path, opts);
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((d && (d.detail || d.message)) || ('HTTP ' + r.status));
  return d;
}
function msg(el, text, kind) { el.className = 'msg ' + kind; el.textContent = text; }
function hideMsg(el) { el.className = 'msg'; }

// tabs
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + t.dataset.tab));
  if (t.dataset.tab === 'accounts') loadAccounts();
  if (t.dataset.tab === 'history') loadHistory();
});

// ── accounts ──
async function loadAccounts() {
  const list = $('acc-list');
  try {
    const d = await api('/accounts');
    const accs = d.accounts || [];
    const sel = $('syn-account');
    sel.innerHTML = accs.filter(a => a.enabled).map(a => `<option value="${a.email}">${a.email}${a.label ? ' — ' + a.label : ''}</option>`).join('') || '<option value="">(chưa có tài khoản)</option>';
    if (!accs.length) { list.innerHTML = '<div class="empty">Chưa có tài khoản. Thêm ở trên để bắt đầu.</div>'; return; }
    list.innerHTML = accs.map(a => `
      <div class="acc">
        <div>
          <div class="who">${a.email} ${a.enabled ? '<span class="tag on">● bật</span>' : '<span class="tag off">○ tắt</span>'}</div>
          <div class="meta">${a.label || ''}${a.last_error ? ' ⚠ ' + a.last_error : ''}</div>
        </div>
        <div class="actions">
          <button class="btn ghost sm" onclick="testAccount('${a.email}', this)">Test</button>
          <button class="btn ghost sm" onclick="toggleAccount('${a.email}', ${!a.enabled})">${a.enabled ? 'Tắt' : 'Bật'}</button>
          <button class="btn danger sm" onclick="removeAccount('${a.email}')">Xoá</button>
        </div>
      </div>`).join('');
  } catch (e) { list.innerHTML = `<div class="empty">Lỗi: ${e.message}</div>`; }
}
async function addAccount() {
  const btn = $('btn-add-acc'), m = $('acc-msg');
  const email = $('acc-email').value.trim(), password = $('acc-pass').value, label = $('acc-label').value.trim();
  if (!email || !password) return msg(m, 'Nhập email và mật khẩu.', 'err');
  btn.disabled = true; msg(m, 'Đang lưu...', 'warn');
  try {
    await api('/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, label }) });
    msg(m, 'Đã lưu. Bấm Test để kiểm tra đăng nhập.', 'ok');
    $('acc-email').value = ''; $('acc-pass').value = ''; $('acc-label').value = '';
    loadAccounts();
  } catch (e) { msg(m, e.message, 'err'); }
  btn.disabled = false;
}
async function removeAccount(email) {
  if (!confirm('Xoá tài khoản ' + email + '?')) return;
  try { await api('/accounts/' + encodeURIComponent(email), { method: 'DELETE' }); loadAccounts(); }
  catch (e) { alert(e.message); }
}
async function toggleAccount(email, enabled) {
  try { await api('/accounts/' + encodeURIComponent(email) + '/toggle?enabled=' + enabled, { method: 'POST' }); loadAccounts(); }
  catch (e) { alert(e.message); }
}
async function testAccount(email, btn) {
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const d = await api('/accounts/' + encodeURIComponent(email) + '/test', { method: 'POST' });
    alert(d.status === 'success' ? '✅ ' + d.message : '⚠ ' + (d.message || ''));
  } catch (e) { alert('❌ ' + e.message); }
  btn.disabled = false; btn.textContent = orig; loadAccounts();
}

// ── synthesize ──
let allSpeakers = [];
async function loadLanguages() {
  try {
    const langs = await api('/languages');
    $('syn-lang').innerHTML = '<option value="">Tất cả</option>' +
      (Array.isArray(langs) ? langs : []).map(l => `<option value="${l.language}">${l.language} (${l.speakerCount})</option>`).join('');
  } catch (e) { /* server may not be up until an account exists */ }
}
async function loadSpeakers() {
  const email = $('syn-account').value;
  const sp = $('syn-speaker'), cnt = $('speaker-count');
  if (!email) { sp.innerHTML = '<option value="">(chọn tài khoản trước)</option>'; cnt.textContent = ''; return; }
  sp.innerHTML = '<option>Đang tải giọng...</option>';
  try {
    const lang = $('syn-lang').value;
    const q = new URLSearchParams({ email }); if (lang) q.set('language', lang);
    allSpeakers = await api('/speakers?' + q.toString());
    if (!Array.isArray(allSpeakers) || !allSpeakers.length) { sp.innerHTML = '<option value="">(không có giọng)</option>'; cnt.textContent = ''; return; }
    sp.innerHTML = allSpeakers.map(s => `<option value="${s.id}">${s.name || s.id}${s.language ? ' [' + s.language + ']' : ''}</option>`).join('');
    cnt.textContent = allSpeakers.length + ' giọng khả dụng';
  } catch (e) { sp.innerHTML = '<option value="">Lỗi tải giọng</option>'; cnt.textContent = e.message; }
}
$('syn-account').onchange = loadSpeakers;
$('syn-lang').onchange = loadSpeakers;

async function previewVoice() {
  const id = $('syn-speaker').value, email = $('syn-account').value, btn = $('btn-preview');
  if (!id || !email) return;
  const voice = allSpeakers.find(s => s.id === id) || {};
  const lang = voice.language || $('syn-lang').value || '';
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const q = new URLSearchParams({ email }); if (lang) q.set('lang', lang);
    const r = await fetch(API + '/preview/' + encodeURIComponent(id) + '?' + q.toString());
    if (!r.ok) { let d = null; try { d = await r.json(); } catch (e) {} throw new Error((d && d.detail) || ('HTTP ' + r.status)); }
    const blob = await r.blob();
    const a = $('syn-audio'); a.src = URL.createObjectURL(blob); a.style.display = 'block'; a.play();
  } catch (e) { msg($('syn-msg'), 'Nghe thử lỗi: ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = orig;
}
async function doSynthesize() {
  const email = $('syn-account').value, text = $('syn-text').value.trim();
  const m = $('syn-msg'), btn = $('btn-synth');
  if (!email) return msg(m, 'Chưa chọn tài khoản. Thêm một tài khoản ở tab Tài khoản.', 'err');
  if (!text) return msg(m, 'Nhập nội dung cần đọc.', 'err');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Đang tổng hợp...';
  msg(m, 'CapCut đang tạo giọng, có thể mất vài giây...', 'warn');
  try {
    const r = await fetch(API + '/synthesize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, text, speaker: $('syn-speaker').value, speed: +$('syn-speed').value, volume: +$('syn-volume').value })
    });
    if (!r.ok) { let d = null; try { d = await r.json(); } catch (e) {} throw new Error((d && d.detail) || ('HTTP ' + r.status)); }
    const blob = await r.blob();
    const a = $('syn-audio'); a.src = URL.createObjectURL(blob); a.style.display = 'block'; a.play();
    hideMsg(m); msg(m, '✅ Xong. File đã lưu vào Lịch sử.', 'ok');
  } catch (e) { msg(m, '❌ ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = '🔊 Tổng hợp giọng nói';
}

// ── history ──
async function loadHistory() {
  const list = $('hist-list');
  try {
    const d = await api('/history');
    const items = d.items || [];
    if (!items.length) { list.innerHTML = '<div class="empty">Chưa có file nào.</div>'; return; }
    list.innerHTML = items.map(it => {
      const when = new Date(it.created * 1000).toLocaleString();
      const kb = Math.round(it.size / 1024);
      return `<div class="hist">
        <div><div style="font-family:var(--mono);font-size:.82rem">${it.file}</div><div class="meta" style="color:var(--text-muted);font-size:.74rem">${when} · ${kb} KB</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <audio controls preload="none" src="${API}/history/${encodeURIComponent(it.file)}"></audio>
          <button class="btn danger sm" onclick="delHistory('${it.file}')">Xoá</button>
        </div></div>`;
    }).join('');
  } catch (e) { list.innerHTML = `<div class="empty">Lỗi: ${e.message}</div>`; }
}
async function delHistory(f) {
  try { await api('/history/' + encodeURIComponent(f), { method: 'DELETE' }); loadHistory(); }
  catch (e) { alert(e.message); }
}

// init
loadAccounts().then(loadLanguages);
</script>
</body>
</html>
