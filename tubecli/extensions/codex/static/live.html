<script>
/* Cùng giao ước theme với codex.html: ?theme=light|dark|glass; không có thì theo hệ điều hành. */
(function () {
    try {
        var t = new URLSearchParams(window.location.search).get('theme');
        if (t === 'glass' || t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* mặc định tối */ }
})();
</script>
