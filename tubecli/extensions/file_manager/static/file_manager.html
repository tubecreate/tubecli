<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Manager — TubeCLI</title>

<!--
  Fonts are a progressive enhancement only. The Google stylesheet is requested with
  media="print" so it can never block first paint, and the CSS declares a complete
  system stack, so the page is correct with no internet at all. Icons are an inline
  SVG sprite rather than an icon font: a failed icon-font load renders the ligature
  name as literal text ("folder_open") and reflows every toolbar.
-->
<link rel="stylesheet" href="/file-manager-static/file_manager.css?v=7">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print" onload="this.media='all'">

<script>
/*
 * Pre-paint language guess.
 *
 * <html lang> should be right before first paint, but the authoritative app
 * language only arrives from /api/v1/settings/language. 'tubecli_lang' is the same
 * key the dashboard writes in changeLanguage(), so this is the app's own last known
 * value rather than a hardcoded locale. navigator.language is the final fallback,
 * and the i18n loader below corrects both once the API answers.
 */
(function () {
    try {
        var cached = localStorage.getItem('tubecli_lang');
        document.documentElement.lang = cached || (navigator.language || 'en').slice(0, 2);
    } catch (e) {
        /* Private-mode browsers throw on localStorage; the served lang stands. */
    }
})();
</script>
</head>
<body>

     viewBox of its own and the geometry scales to whatever size CSS gives it.
     Symbols not referenced by this markup are for JS-rendered content (file-type
     icons, quick-access entries, volume rows, toast severities).

    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></symbol>

</svg>


<div id="fm-app" class="fm-app" data-view="files" data-rail="open" data-panel="closed">

  <!-- ══════════════════ HEADER ══════════════════ -->
  <header class="fm-header">

    <div class="fm-header-left">
      <button type="button" class="fm-icon-btn fm-rail-toggle" data-fm-action="toggle-rail"
              data-i18n-title="fm.nav.quick_access" aria-expanded="true" aria-controls="fm-rail">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-list"/></svg>
        <span class="fm-sr" data-i18n="fm.nav.quick_access"></span>
      </button>

      <a href="/dashboard#/dashboard" target="_top" class="fm-back" data-i18n-title="fm.nav.back">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-arrow-left"/></svg>
        <span class="fm-back-label" data-i18n="fm.nav.back"></span>
      </a>

      <div class="fm-brand">
        <span class="fm-brand-mark" aria-hidden="true">
          <svg class="fm-ico" aria-hidden="true"><use href="#i-folder"/></svg>
        </span>
        <span class="fm-brand-text">
          <span class="fm-brand-title" data-i18n="fm.nav.title"></span>
          <span class="fm-brand-sub" data-i18n="fm.nav.subtitle"></span>
        </span>
      </div>
    </div>

    <div class="fm-header-center">
      <nav class="fm-breadcrumb fm-scroll-x" id="breadcrumb" data-i18n-aria-label="fm.common.path"></nav>
    </div>

    <div class="fm-header-right">
      <div class="fm-search">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="fm.browse.search_placeholder"
               data-i18n-aria-label="fm.common.search">
      </div>

      <div class="fm-segmented" role="group" data-i18n-aria-label="fm.common.type">
        <button type="button" class="fm-seg-btn is-active" id="viewGrid" data-fm-action="view-grid"
                data-i18n-title="fm.browse.view_grid" aria-pressed="true">
          <svg class="fm-ico" aria-hidden="true"><use href="#i-grid"/></svg>
          <span class="fm-sr" data-i18n="fm.browse.view_grid"></span>
        </button>
        <button type="button" class="fm-seg-btn" id="viewList" data-fm-action="view-list"
                data-i18n-title="fm.browse.view_list" aria-pressed="false">
          <svg class="fm-ico" aria-hidden="true"><use href="#i-list"/></svg>
          <span class="fm-sr" data-i18n="fm.browse.view_list"></span>
        </button>
      </div>

      <label class="fm-icon-btn fm-check-btn" data-i18n-title="fm.browse.show_hidden">
        <input type="checkbox" id="showHidden">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-eye"/></svg>
        <span class="fm-sr" data-i18n="fm.browse.show_hidden"></span>
      </label>

      <button type="button" class="fm-icon-btn" data-fm-action="toggle-panel"
              data-i18n-title="fm.browse.properties" aria-expanded="false" aria-controls="propertiesPanel">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-panel-right"/></svg>
        <span class="fm-sr" data-i18n="fm.browse.properties"></span>
      </button>
    </div>
  </header>

  <!-- ══════════════════ VIEW TABS ══════════════════ -->
  <div class="fm-viewbar">
    <div class="fm-tabs fm-scroll-x" role="tablist" data-i18n-aria-label="fm.nav.title">
      <button type="button" class="fm-tab is-active" role="tab" id="fm-tab-files"
              aria-selected="true" aria-controls="fm-view-files" data-fm-action="view" data-fm-view="files">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-folder"/></svg>
        <span data-i18n="fm.nav.browse"></span>
      </button>
      <button type="button" class="fm-tab" role="tab" id="fm-tab-storage"
              aria-selected="false" aria-controls="fm-view-storage" data-fm-action="view" data-fm-view="storage">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-pie"/></svg>
        <span data-i18n="fm.nav.usage"></span>
      </button>
      <button type="button" class="fm-tab" role="tab" id="fm-tab-cleanup"
              aria-selected="false" aria-controls="fm-view-cleanup" data-fm-action="view" data-fm-view="cleanup">
        <svg class="fm-ico" aria-hidden="true"><use href="#i-sparkle"/></svg>
        <span data-i18n="fm.nav.cleanup"></span>
      </button>
      <!-- No Google Drive tab here: Drive is opened from the sidebar (each
           account is a folder), so it is not duplicated in the top tab bar. -->
    </div>

    <div class="fm-viewbar-right">
      <span class="fm-scope" id="fm-scope-path"></span>
    </div>
  </div>

  <!-- ══════════════════ PICKER BANNER ══════════════════ -->
  <div class="fm-banner" id="pickerBanner" hidden>
    <svg class="fm-ico" aria-hidden="true"><use href="#i-cursor"/></svg>
    <span class="fm-banner-text" data-i18n="fm.picker.hint"></span>
    <button type="button" class="fm-btn fm-btn-primary" id="btnPickerSelect" data-fm-action="picker-confirm" disabled>
      <svg class="fm-ico" aria-hidden="true"><use href="#i-check"/></svg>
      <span data-i18n="fm.picker.select"></span>
    </button>
  </div>

  <!-- ══════════════════ BODY ══════════════════ -->
  <div class="fm-body">

    <!-- ─────────── LEFT RAIL ─────────── -->
    <aside class="fm-rail" id="fm-rail">
      <section class="fm-rail-section">
        <h2 class="fm-rail-title" data-i18n="fm.nav.quick_access"></h2>
        <!-- JS fills from GET /roots. Items use .fm-rail-item. -->
        <div id="quickAccess" class="fm-rail-list"></div>
        <p class="fm-rail-note fm-rail-note-sm" data-i18n="fm.nav.allowed_roots"></p>
      </section>

      <!-- Google Drive shortcut. The header row opens the Drive tab; fm_drive.js
           fills #fm-drive-rail with one row per authorized account — each account
           is one "folder" that opens the tab pinned to that account. -->
      <section class="fm-rail-section fm-rail-drive">
        <h2 class="fm-rail-title">
          <button type="button" class="fm-rail-item fm-rail-drive-head" data-fm-action="view" data-fm-view="drive">
            <svg class="fm-ico" aria-hidden="true"><use href="#i-cloud"/></svg>
            <span data-i18n="fm.nav.drive"></span>
          </button>
        </h2>
        <div id="fm-drive-rail" class="fm-rail-list"></div>
        <p class="fm-rail-note fm-rail-note-sm" id="fm-drive-rail-note" hidden
           data-i18n="fm.drive.no_accounts_rail"></p>
      </section>

      <section class="fm-rail-section fm-rail-volumes">
        <h2 class="fm-rail-title">
          <span data-i18n="fm.disk.title"></span>
          <button type="button" class="fm-icon-btn fm-icon-btn-xs" data-fm-action="volumes-refresh"
                  data-i18n-title="fm.common.refresh">
            <svg class="fm-ico" aria-hidden="true"><use href="#i-refresh"/></svg>
            <span class="fm-sr" data-i18n="fm.common.refresh"></span>
          </button>
        </h2>

        <!-- JS fills from GET /api/v1/file-manager/disk.
             Row shape: .fm-vol[data-state="ok|warn|crit"], bar width set inline.
             warn crosses 80%, crit crosses 92%. -->
        <div id="fm-volumes" class="fm-vol-list" aria-live="polite"></div>

        <!-- Starts as "reading…", then becomes the empty or error message. Never
             left blank while nothing renders, which would read as "no disks". -->
        <p class="fm-rail-note" id="fm-volumes-state" data-i18n="fm.disk.reading"></p>
        <p class="fm-rail-note fm-rail-note-sm" data-i18n="fm.disk.skipped_pseudo"></p>
      </section>
    </aside>

    <!-- ─────────── MAIN ─────────── -->
    <main class="fm-main">

      <!-- ========== VIEW: FILES ========== -->
      <section class="fm-view fm-view-files" id="fm-view-files" role="tabpanel" aria-labelledby="fm-tab-files">

        <div class="fm-toolbar">
          <div class="fm-toolbar-group">
            <button type="button" class="fm-btn fm-btn-primary" data-fm-action="new-folder">
              <svg class="fm-ico" aria-hidden="true"><use href="#i-folder-plus"/></svg>
              <span class="fm-btn-label" data-i18n="fm.browse.new_folder"></span>
            </button>
            <button type="button" class="fm-btn" data-fm-action="new-file">
              <svg class="fm-ico" aria-hidden="true"><use href="#i-file-plus"/></svg>
              <span class="fm-btn-label" data-i18n="fm.browse.new_file"></span>
            </button>
          </div>

          <span class="fm-rule" aria-hidden="true"></span>

          <div class="fm-toolbar-group">
            <button type="button" class="fm-btn fm-btn-quiet" id="btnRename" data-fm-action="rename"
                    data-i18n-title="fm.browse.rename" disabled>
              <svg class="fm-ico" aria-hidden="true"><use href="#i-edit"/></svg>
              <span class="fm-sr" data-i18n="fm.browse.rename"></span>
            </button>
            <button type="button" class="fm-btn fm-btn-quiet" id="btnCopy" data-fm-action="copy"
                    data-i18n-title="fm.browse.copy" disabled>
              <svg class="fm-ico" aria-hidden="true"><use href="#i-copy"/></svg>
              <span class="fm-sr" data-i18n="fm.browse.copy"></span>
            </button>
            <button type="button" class="fm-btn fm-btn-quiet" id="btnPaste" data-fm-action="paste"
                    data-i18n-title="fm.browse.paste" disabled>
              <svg class="fm-ico" aria-hidden="true"><use href="#i-clipboard"/></svg>
              <span class="fm-sr" data-i18n="fm.browse.paste"></span>
            </button>
            <button type="button" class="fm-btn fm-btn-quiet fm-btn-danger" id="btnDelete" data-fm-action="delete"
                    data-i18n-title="fm.browse.delete" disabled>
              <svg class="fm-ico" aria-hidden="true"><use href="#i-trash"/></svg>
              <span class="fm-sr" data-i18n="fm.browse.delete"></span>
            </button>
          </div>

          <div class="fm-toolbar-group fm-toolbar-end">
            <button type="button" class="fm-btn fm-btn-quiet" data-fm-action="up" data-i18n-title="fm.browse.parent">
              <svg class="fm-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg>
              <span class="fm-sr" data-i18n="fm.browse.parent"></span>
            </button>
            <button type="button" class="fm-btn fm-btn-quiet" data-fm-action="refresh" data-i18n-title="fm.common.refresh">
              <svg class="fm-ico" aria-hidden="true"><use href="#i-refresh"/></svg>

    var translations = {};
    var lang = document.documentElement.lang || 'en';

    function t(key) {
        if (Object.prototype.hasOwnProperty.call(translations, key)) {
            var v = translations[key];
            /* /api/v1/i18n/{lang} shallow-merges whole extension files, so a
               top-level key can legitimately be an object. Only strings are text;
               rendering an object would print "[object Object]". */
            if (typeof v === 'string' && v.length) return v;
        }
        if (Object.prototype.hasOwnProperty.call(DEFAULTS, key)) return DEFAULTS[key];
        return key;
    }

    /* Substitutes {name} from data-i18n-var-<name>, whose value is itself an i18n
       key. Lets a templated string such as "Gõ {word} để xác nhận" stay declarative
       instead of being assembled in JS. */
    function resolve(el, key) {
        var s = t(key);
        var ds = el.dataset;
        for (var prop in ds) {
            if (prop.indexOf('i18nVar') === 0 && prop.length > 7) {
                var name = prop.charAt(7).toLowerCase() + prop.slice(8);
                s = s.split('{' + name + '}').join(t(ds[prop]));
            }
        }
        return s;
    }

    function apply(root) {
        var scope = root || document;
        /* data-i18n-template is intentionally NOT handled here: those strings carry
           runtime values ({count}, {size}, {n}) that only the view code knows. */
        scope.querySelectorAll('[data-i18n]').forEach(function (el) {
            el.textContent = resolve(el, el.getAttribute('data-i18n'));
        });
        scope.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
            el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
        });
        scope.querySelectorAll('[data-i18n-title]').forEach(function (el) {
            el.title = t(el.getAttribute('data-i18n-title'));
        });
        scope.querySelectorAll('[data-i18n-aria-label]').forEach(function (el) {
            el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria-label')));
        });
    }

    async function load() {
        var apiBase;
        try {
            apiBase = localStorage.getItem('tubecli_api') || window.location.origin;
        } catch (e) {
            apiBase = window.location.origin;
        }

        try {
            var r = await fetch(apiBase + '/api/v1/settings/language');
            if (r.ok) {
                var d = await r.json();
                if (d && d.language) {
                    lang = d.language;
                    try { localStorage.setItem('tubecli_lang', lang); } catch (e2) {}
                }
            }
        } catch (e) {
            /* Offline: keep the pre-paint guess. DEFAULTS still render a full UI. */
        }
        document.documentElement.lang = lang;

        try {
            var rd = await fetch(apiBase + '/api/v1/i18n/' + encodeURIComponent(lang));
            if (rd.ok) {
                var dict = await rd.json();
                if (dict && typeof dict === 'object') translations = dict;
            }
        } catch (e) {
            /* Offline: DEFAULTS only. */
        }

        apply(document);
        window.FMI18N.lang = lang;
        window.FMI18N.ready = true;
        document.dispatchEvent(new CustomEvent('fm:i18n-ready', { detail: { lang: lang } }));
    }

    window.FMI18N = { t: t, apply: apply, resolve: resolve, lang: lang, ready: false, defaults: DEFAULTS };

    /* Paint the bundled defaults immediately so no raw key is ever visible, then
       upgrade in place once the API answers. */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { apply(document); load(); });
    } else {
        apply(document);
        load();
    }
})();
</script>

<script src="/file-manager-static/file_manager.js?v=12"></script>

<!--
  The [data-fm-action] modules. Classic scripts, so they run in document order.

  All four must follow file_manager.js: it publishes window.FM and window.T from
  inside its IIFE, and fm_actions wraps FM.navigate and installs the #fmVolumes
  sink at parse time — which still lands before FM.init() runs on DOMContentLoaded.

  fm_actions must lead the other three: it defines FMActions.register(). The
  siblings do poll for it, but that is a safety net; loading the router first
  keeps registration synchronous and makes "first claim wins" deterministic,
  so which module owns a duplicated name never depends on network timing.
-->
<script src="/file-manager-static/fm_actions.js?v=4"></script>
<script src="/file-manager-static/fm_storage.js?v=1"></script>
<script src="/file-manager-static/fm_cleanup.js?v=1"></script>
